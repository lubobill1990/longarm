<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Longarm desktop spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 12px system-ui; }
  #bar { position: fixed; top: 0; left: 0; right: 0; padding: 4px 8px; background: #000a; z-index: 1; }
  #wrap { position: absolute; inset: 24px 0 0 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; outline: none; cursor: default; }
</style>
</head>
<body>
<div id="bar">connecting… <span id="stats"></span></div>
<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<script>
// KeyboardEvent.code -> PC/AT set-1 scan code (0xE0xx: extended).
const SC = {
  Escape:1, Digit1:2, Digit2:3, Digit3:4, Digit4:5, Digit5:6, Digit6:7, Digit7:8, Digit8:9, Digit9:10, Digit0:11,
  Minus:12, Equal:13, Backspace:14, Tab:15, KeyQ:16, KeyW:17, KeyE:18, KeyR:19, KeyT:20, KeyY:21, KeyU:22, KeyI:23,
  KeyO:24, KeyP:25, BracketLeft:26, BracketRight:27, Enter:28, ControlLeft:29, KeyA:30, KeyS:31, KeyD:32, KeyF:33,
  KeyG:34, KeyH:35, KeyJ:36, KeyK:37, KeyL:38, Semicolon:39, Quote:40, Backquote:41, ShiftLeft:42, Backslash:43,
  KeyZ:44, KeyX:45, KeyC:46, KeyV:47, KeyB:48, KeyN:49, KeyM:50, Comma:51, Period:52, Slash:53, ShiftRight:54,
  NumpadMultiply:55, AltLeft:56, Space:57, CapsLock:58, F1:59, F2:60, F3:61, F4:62, F5:63, F6:64, F7:65, F8:66,
  F9:67, F10:68, NumLock:69, ScrollLock:70, Numpad7:71, Numpad8:72, Numpad9:73, NumpadSubtract:74, Numpad4:75,
  Numpad5:76, Numpad6:77, NumpadAdd:78, Numpad1:79, Numpad2:80, Numpad3:81, Numpad0:82, NumpadDecimal:83,
  IntlBackslash:86, F11:87, F12:88,
  NumpadEnter:0xE01C, ControlRight:0xE01D, NumpadDivide:0xE035, AltRight:0xE038, Home:0xE047, ArrowUp:0xE048,
  PageUp:0xE049, ArrowLeft:0xE04B, ArrowRight:0xE04D, End:0xE04F, ArrowDown:0xE050, PageDown:0xE051,
  Insert:0xE052, Delete:0xE053, MetaLeft:0xE05B, MetaRight:0xE05C, ContextMenu:0xE05D,
};
const cv = document.getElementById('c'), g = cv.getContext('2d');
const bar = document.getElementById('bar'), stats = document.getElementById('stats');
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.binaryType = 'arraybuffer';
let bytes = 0, tiles = 0, last = performance.now(), dec = null, codec = 'jpeg';
ws.onopen = () => bar.firstChild.textContent = 'connected ';
ws.onclose = () => bar.firstChild.textContent = 'disconnected ';
// Tiles are decoded asynchronously; draw them in arrival order.
let chain = Promise.resolve();
ws.onmessage = ev => {
  const b = new Uint8Array(ev.data);
  bytes += b.length;
  if (b[0] === 67) { // 'C': H.264 config
    const cfg = JSON.parse(new TextDecoder().decode(b.subarray(1)));
    cv.width = cfg.w; cv.height = cfg.h;
    if (dec) dec.close();
    dec = new VideoDecoder({
      output: f => { g.drawImage(f, 0, 0); f.close(); tiles++; },
      error: e => { bar.firstChild.textContent = 'decoder: ' + e.message + ' '; },
    });
    dec.configure({codec: cfg.codec, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware'});
    codec = cfg.codec;
    return;
  }
  if (b[0] === 72) { // 'H': access unit, Annex B
    if (!dec || dec.state !== 'configured') return;
    dec.decode(new EncodedVideoChunk({type: b[1] & 1 ? 'key' : 'delta', timestamp: performance.now() * 1000, data: b.subarray(2)}));
    return;
  }
  if (b[0] === 73) { // 'I'
    const info = JSON.parse(new TextDecoder().decode(b.subarray(1)));
    cv.width = info.w; cv.height = info.h;
    return;
  }
  const v = new DataView(ev.data);
  const x = v.getUint16(1), y = v.getUint16(3);
  const bmp = createImageBitmap(new Blob([b.subarray(9)], {type: 'image/jpeg'}));
  chain = chain.then(() => bmp).then(img => { g.drawImage(img, x, y); img.close(); tiles++; });
};
setInterval(() => {
  const s = (performance.now() - last) / 1000; last = performance.now();
  stats.textContent = `${codec} ${cv.width}x${cv.height}  ${(bytes / 1024 / s).toFixed(0)} KB/s  ${(tiles / s).toFixed(1)} frames/s`;
  bytes = tiles = 0;
}, 1000);
const send = m => ws.readyState === 1 && ws.send(JSON.stringify(m));
const pos = e => {
  const r = cv.getBoundingClientRect();
  return {X: Math.round((e.clientX - r.left) * cv.width / r.width), Y: Math.round((e.clientY - r.top) * cv.height / r.height)};
};
const BTN = {0: 0, 1: 1, 2: 2};
let pending = null;
cv.addEventListener('mousemove', e => {
  // At most one move per animation frame.
  if (!pending) requestAnimationFrame(() => { send({t: 'm', ...pending}); pending = null; });
  pending = pos(e);
});
cv.addEventListener('mousedown', e => { cv.focus(); send({t: 'm', ...pos(e)}); send({t: 'b', B: BTN[e.button], D: true}); e.preventDefault(); });
cv.addEventListener('mouseup', e => { send({t: 'b', B: BTN[e.button], D: false}); e.preventDefault(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  send({t: 'w', DX: Math.round(-e.deltaX), DY: Math.round(-e.deltaY / Math.abs(e.deltaY || 1) * 120)});
  e.preventDefault();
}, {passive: false});
const key = d => e => {
  const c = SC[e.code];
  if (c !== undefined) { send({t: 'k', C: c, D: d}); e.preventDefault(); }
};
cv.addEventListener('keydown', key(true));
cv.addEventListener('keyup', key(false));
</script>
</body>
</html>
