# GoReleaser (v2) config for Longarm. Use the wrappers, which also build
# the MSI and the hub release dir with minisign signatures:
#
#   pwsh packaging/build.ps1 [-Snapshot]          # Windows (MSI needs WiX v5)
#   sh   packaging/build.sh  [--snapshot]         # Linux / macOS
#
# Env:
#   LONGARM_UPDATE_PUBKEY   minisign public key built into longarmd (self-update); empty = updates off
#   LONGARM_DEFAULT_HUB     the hub built into longarm / longarmd / longarm-tray (login without a hub,
#                           the MSI's "Default"), a domain; empty = none
#   LONGARM_DEFAULT_HUB_CA  optional sha256 pin of that hub's CA
#   LONGARM_TRAY=1          also build cmd/longarm-tray (set by the wrappers when it exists)
#   LONGARM_BUILD_SIDE      unix / windows: only that side's targets (release.yml; see builds); empty = all
#   LONGARM_SIGN_PROFILE    set: Authenticode-sign the Windows binaries as they are built
#                           (packaging/windows/sign.ps1 -Setup sets the rest); empty = unsigned
#   (the native Linux tray + its deb: packaging/linux/goreleaser-tray.yaml, run by build.sh)
version: 2
project_name: longarm

before:
  hooks:
    - go mod download

env:
  - CGO_ENABLED=0

# LONGARM_BUILD_SIDE splits the build across two runners (release.yml):
# "unix" builds linux + darwin (and the deb/rpm packages), "windows" the
# Windows binaries (packaging/build.ps1 -Side windows adds the MSIs); unset
# (the local wrappers) builds everything. Every binary has one entry per
# side with the same flags and ldflags; the release names don't depend on
# the entry's id (packaging/hubrelease uses the binary name).
builds:
  - id: longarm
    main: ./cmd/longarm
    binary: longarm
    skip: &unix-only '{{ eq (envOrDefault "LONGARM_BUILD_SIDE" "") "windows" }}'
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/lubobill1990/longarm/internal/version.Version={{ .Version }}
      - -X github.com/lubobill1990/longarm/internal/update.PublicKey={{ envOrDefault "LONGARM_UPDATE_PUBKEY" "" }}
      - -X github.com/lubobill1990/longarm/internal/version.DefaultHub={{ envOrDefault "LONGARM_DEFAULT_HUB" "" }}
      - -X github.com/lubobill1990/longarm/internal/version.DefaultHubCA={{ envOrDefault "LONGARM_DEFAULT_HUB_CA" "" }}
  - id: longarm-windows
    main: ./cmd/longarm
    binary: longarm
    skip: &windows-only '{{ eq (envOrDefault "LONGARM_BUILD_SIDE" "") "unix" }}'
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
    # Authenticode (Trusted Signing) right after the build, before the archives and checksums:
    # packaging/windows/sign.ps1 when LONGARM_SIGN_PROFILE is set (release.yml), else a no-op.
    # The path in single quotes: the hook's command line is split shell-style (backslashes).
    hooks: &winsign
      post:
        - cmd: >-
            {{ if ne (envOrDefault "LONGARM_SIGN_PROFILE" "") "" }}pwsh -NoLogo -NoProfile -NonInteractive
            -File packaging/windows/sign.ps1 '{{ .Path }}'{{ else }}go version{{ end }}
          output: true
  - id: longarmd
    main: ./cmd/longarmd
    binary: longarmd
    skip: *unix-only
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: longarmd-windows
    main: ./cmd/longarmd
    binary: longarmd
    skip: *windows-only
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
    hooks: *winsign
  - id: longarm-hub
    main: ./cmd/longarm-hub
    binary: longarm-hub
    skip: *unix-only
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: longarm-hub-windows
    main: ./cmd/longarm-hub
    binary: longarm-hub
    skip: *windows-only
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
    hooks: *winsign
  - id: longarm-relay
    main: ./cmd/longarm-relay
    binary: longarm-relay
    skip: *unix-only
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: longarm-relay-windows
    main: ./cmd/longarm-relay
    binary: longarm-relay
    skip: *windows-only
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
    hooks: *winsign
  # The tray (built on the ui branch). Windows only by default: the shells
  # for macOS/Linux use system WebViews that need cgo (build those natively).
  - id: longarm-tray
    main: ./cmd/longarm-tray
    binary: longarm-tray
    skip: '{{ or (not (isEnvSet "LONGARM_TRAY")) (eq (envOrDefault "LONGARM_BUILD_SIDE" "") "unix") }}'
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # production: Wails without devtools and the WebView2 debug context menu
    tags: [production]
    ldflags:
      - -s -w -H windowsgui
      - -X github.com/lubobill1990/longarm/internal/version.Version={{ .Version }}
      - -X github.com/lubobill1990/longarm/internal/version.DefaultHub={{ envOrDefault "LONGARM_DEFAULT_HUB" "" }}
      - -X github.com/lubobill1990/longarm/internal/version.DefaultHubCA={{ envOrDefault "LONGARM_DEFAULT_HUB_CA" "" }}
      # the tray's "Update to X" verifies the MSI's signature with it
      - -X github.com/lubobill1990/longarm/internal/update.PublicKey={{ envOrDefault "LONGARM_UPDATE_PUBKEY" "" }}
    hooks: *winsign

archives:
  # Client + worker bundle: longarm, longarmd (+ longarm-tray).
  - id: longarm
    ids: [longarm, longarm-windows, longarmd, longarmd-windows, longarm-tray]
    # longarm-tray is built for Windows only here.
    allow_different_binary_count: true
    name_template: "longarm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
  - id: longarm-hub
    ids: [longarm-hub, longarm-hub-windows, longarm-relay, longarm-relay-windows]
    name_template: "longarm-hub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - deploy/hub/hub.toml.example
      - deploy/hub/README.md

nfpms:
  - id: longarm
    package_name: longarm
    ids: [longarm, longarmd]
    formats: [deb, rpm]
    vendor: Longarm
    homepage: https://github.com/lubobill1990/longarm
    maintainer: Longarm contributors <lubobill1990@users.noreply.github.com>
    description: |-
      Longarm client and worker: run Claude Code / Copilot CLI sessions,
      commands and jobs on a pool of remote workers (longarm, longarmd).
    license: MIT
    bindir: /usr/bin
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    recommends: [git]
    suggests: [longarm-tray]
    contents:
      - src: packaging/linux/longarmd@.service
        dst: /lib/systemd/system/longarmd@.service
      - src: packaging/linux/longarmd-peruser.service
        dst: /lib/systemd/system/longarmd-peruser.service
      - src: packaging/linux/join.env.example
        dst: /etc/longarm/join.env.example
        type: config|noreplace
    scripts:
      postinstall: packaging/linux/postinst.sh
      preremove: packaging/linux/prerm.sh
  - id: longarm-hub
    package_name: longarm-hub
    ids: [longarm-hub, longarm-relay]
    formats: [deb]
    vendor: Longarm
    homepage: https://github.com/lubobill1990/longarm
    maintainer: Longarm contributors <lubobill1990@users.noreply.github.com>
    description: Longarm hub (control plane, CA, scheduler, relay).
    license: MIT
    bindir: /usr/bin
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    contents:
      - src: packaging/linux/longarm-hub.service
        dst: /lib/systemd/system/longarm-hub.service
      - src: deploy/hub/hub.toml.example
        dst: /etc/longarm-hub/hub.toml.example
    scripts:
      postinstall: packaging/linux/hub-postinst.sh

checksum:
  name_template: checksums.txt

# The longarm-hub container image is not built here: .github/workflows/image.yml
# (deploy/hub/Dockerfile, with Litestream) publishes it.

homebrew_casks:
  - name: longarm
    ids: [longarm]
    binaries: [longarm, longarmd]
    homepage: https://github.com/lubobill1990/longarm
    description: Longarm client and worker (longarm, longarmd)
    skip_upload: true   # template only: packaging/homebrew/README.md
    repository:
      owner: '{{ envOrDefault "HOMEBREW_TAP_OWNER" "your-org" }}'
      name: homebrew-tap
    directory: Casks

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  draft: true
  prerelease: auto

changelog:
  use: git
  sort: asc
