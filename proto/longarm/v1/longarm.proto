// Longarm worker API (served by longarmd, consumed by longarm / later longarm-hub / longarm-tray).
//
// One proto package, one service per capability area so that later phases add
// services rather than mutate existing ones:
//   P0a: Node, Exec, Jobs, Metrics, Admin
//   P0b: Sessions (named PTY sessions: attach/detach/resize, ConPTY / pty),
//        Forward (one bidi byte stream per forwarded TCP connection, plus the
//        stream behind `longarm proxy` into the built-in sshd), Files (chunked
//        read/write with offsets + sha256 for resumable transfers), Workspace
//        (git mirror + worktree sync).
//
// Transport-agnostic: everything runs over gRPC + app-level mTLS on top of a
// net.Conn supplied by a Transport backend (tcp / tailscale tsnet / longnet).
// Authorization is by the role embedded in the caller's certificate, and -
// with multi-tenancy - by ownership: jobs, sessions, files and forwards
// belong to the caller's user (docs/security.md).
syntax = "proto3";

package longarm.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lubobill1990/longarm/proto/longarm/v1;longarmv1";

// ---------------------------------------------------------------- Node

service Node {
  // Info describes the worker and echoes the caller identity. Any role.
  rpc Info(InfoRequest) returns (InfoResponse);
}

message InfoRequest {}

message InfoResponse {
  string name = 1; // worker name (from its certificate)
  string version = 2;
  string os = 3;
  string arch = 4;
  string hostname = 5;
  int32 num_cpu = 6;
  string data_dir = 7;
  google.protobuf.Timestamp started_at = 8;
  string caller_name = 9;
  string caller_role = 10;
  repeated string listeners = 11; // e.g. "tcp://100.64.0.11:7701"
  // Public host key of the built-in sshd in authorized_keys format; clients
  // learn it over mTLS (longarm ssh-config writes it to a known_hosts file).
  string ssh_host_key = 12;
  string isolation = 13; // "shared" | "per-user" (longarmd.toml [isolation] mode)
  string caller_user = 14; // the user the caller acts as (owner of what it creates)
  string account = 15; // per-user isolation: the caller's OS account on this worker
  // Optional features this worker supports, e.g. "job-stdin"
  // (SubmitRequest.stdin). Clients check before relying on a field an older
  // worker would silently ignore.
  repeated string features = 16;
  // The user owning this worker ("" = none recorded: a fleet worker, or one
  // without a hub) and whether it is an admin worker (runs as SYSTEM).
  // Clients decide with them where to forward agent credentials
  // ("agent-auth").
  string owner = 17;
  bool admin_worker = 18;
}

// AgentAuth says which coding agents' credentials the client forwarded
// with a job, exec or session (InfoResponse feature "agent-auth"). The
// credentials themselves travel in secret_env (memory-only, redacted) and
// non-secret settings in env; this message only names them.
message AgentAuth {
  repeated string agents = 1; // "claude", "copilot", "gh"
  // Give the process a fresh private COPILOT_HOME of its own (under the
  // worker's data dir, removed with the job or session) unless env sets
  // COPILOT_HOME.
  bool copilot_home = 2;
}

// ---------------------------------------------------------------- Exec

service Exec {
  // Run executes a short command synchronously (no job dir). The whole process
  // tree is contained and killed on timeout. Output is captured as raw bytes.
  rpc Run(ExecRequest) returns (ExecResponse);
}

enum OutputMode {
  OUTPUT_MODE_UNSPECIFIED = 0; // = SEPARATE
  OUTPUT_MODE_SEPARATE = 1; // stdout and stderr captured separately
  OUTPUT_MODE_COMBINED = 2; // both into one interleaved buffer
}

message ExecRequest {
  repeated string argv = 1;
  string cwd = 2;
  map<string, string> env = 3;
  // Values are passed to the child env only and redacted from the output.
  map<string, string> secret_env = 4;
  google.protobuf.Duration timeout = 5; // default 60s, max 1h
  OutputMode output = 6;
  int64 max_output_bytes = 7; // per buffer; default 1 MiB
  bytes stdin = 8;
  AgentAuth agent_auth = 9;
}

message ExecResponse {
  int32 exit_code = 1; // -1 if the process could not be started
  bytes stdout = 2; // SEPARATE mode
  bytes stderr = 3; // SEPARATE mode
  bytes combined = 4; // COMBINED mode
  bool timed_out = 5;
  bool truncated = 6;
  google.protobuf.Duration duration = 7;
  string error = 8; // start failure etc.
}

// ---------------------------------------------------------------- Jobs

service Jobs {
  // Submit is idempotent on spec.id (client-generated ULID): re-submitting the
  // same id with the same spec returns the existing job; a different spec
  // under an existing id fails with ALREADY_EXISTS.
  rpc Submit(SubmitRequest) returns (Job);
  rpc Get(GetJobRequest) returns (Job);
  rpc List(ListJobsRequest) returns (ListJobsResponse);
  // Logs streams out.log from a byte offset. With follow, the stream stays
  // open until the job is terminal and all bytes were sent. Clients resume
  // after a disconnect by re-calling with offset = last offset + len(data).
  rpc Logs(LogsRequest) returns (stream LogChunk);
  // Wait pushes the job's current snapshot, then one per state change, and
  // ends after a terminal state was sent.
  rpc Wait(WaitRequest) returns (stream Job);
  // Kill terminates the job's whole process tree and returns the final job.
  rpc Kill(KillRequest) returns (Job);
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1; // hub-side (P1)
  JOB_STATE_ASSIGNED = 2; // hub-side (P1)
  JOB_STATE_PREPARING = 3;
  JOB_STATE_RUNNING = 4;
  JOB_STATE_DONE = 5; // exit code 0
  JOB_STATE_FAILED = 6; // non-zero exit or failed to start
  JOB_STATE_KILLED = 7;
  JOB_STATE_LOST = 8; // supervisor (shim) vanished; outcome unknown
}

message JobSpec {
  string id = 1; // [0-9A-Za-z_-]{1,64}; normally a ULID
  string name = 2;
  repeated string argv = 3;
  string cwd = 4;
  map<string, string> env = 5; // persisted in job.json
  repeated string secret_env_names = 6; // names only; values never persisted
  int64 mem_limit_bytes = 7; // 0 = none (best effort per platform)
  map<string, string> labels = 8;
  // Prepare a git worktree as the job's working directory (the job stays
  // "preparing" until it is ready). cwd is then relative to the worktree.
  JobWorkspace workspace = 9;
  // reserved for P1: agent type, retries.
  reserved 10 to 15;
  // Output only: the caller that submitted the job ("client/alice"), set
  // by the worker from the caller's certificate (ignored on submit).
  string submitted_by = 16;
  // Output only: the user owning the job (the caller's certificate user,
  // else its name), set by the worker. Only the owner, members of teams it
  // is shared with (read-only) and admins see a job (multi-tenancy).
  string owner = 17;
  // Output only: teams that may read the job (state and logs), resolved by
  // the worker from SubmitRequest.share.
  repeated string share_teams = 18;
  // CPU limit of the job's process tree in cores (0 = none, or the owner's
  // default from the hub's tenancy policy). Windows: Job Object CPU rate
  // cap; Linux: cgroup cpu.max (per-user isolation only).
  double cpu_limit = 19;
  // Output only: the size of SubmitRequest.stdin, if any. The content
  // itself is never persisted.
  int64 stdin_bytes = 20;
  // Output only: the agents whose credentials were forwarded
  // (SubmitRequest.agent_auth) - names, never values.
  repeated string agent_auth = 21;
}

message JobWorkspace {
  // Mirror key on the worker (<data>/mirrors/<repo>.git), [0-9A-Za-z._-].
  string repo = 1;
  // Fetch url (e.g. https://github.com/o/r). For https urls the job's
  // GH_TOKEN secret, if any, authenticates the fetch (memory only).
  string url = 2;
  string ref = 3; // ref to fetch from url (default HEAD)
  // Exact commit to check out; set when the objects were sent with
  // Workspace.Sync (stage_only), otherwise resolved from url + ref.
  string commit = 4;
  // Uncommitted changes uploaded by Workspace.Sync (stage_only) to apply.
  string staging_id = 5;
  // With url: also fetch the commit's Git LFS content from url (longarm
  // run --lfs fetch), with the forwarded credential if any.
  bool lfs_fetch = 6;
  // Output only: the fetch of url was authenticated with a credential
  // forwarded in SubmitRequest.git_auth (the credential is never stored).
  bool git_auth = 7;
}

// GitAuth is a short-lived credential the client forwards for one fetch
// from a hosted remote (longarm run / sync --git-auth forward). The worker
// keeps it in memory, sends it only to the url being fetched (git's
// http.<url>.extraHeader, passed in the environment of git and git-lfs),
// never to the job, and zeroes it after the fetch.
message GitAuth {
  // "bearer" (secret is the token) or "basic" (username:secret)
  string scheme = 1;
  string username = 2;
  bytes secret = 3;
}

message SubmitRequest {
  JobSpec spec = 1;
  map<string, string> secret_env = 2; // memory-only on the worker
  // Share the job read-only (state, logs) with teams of the owner: "team" =
  // every team of the owner, "team:<name>" = that team. Default private.
  repeated string share = 3;
  // Bytes for the job's standard input (pipe jobs only; at most 1 MiB).
  // Like secret_env memory-only on the worker: never written to job.json,
  // the job index, the audit log or longarmd's logs; the job reads it once
  // and then sees end of file.
  bytes stdin = 4;
  // Credential for fetching spec.workspace.url (InfoResponse.features
  // "git-auth-forward"). Memory-only like stdin: used for the workspace
  // fetch (git and git-lfs) and zeroed; never in job.json, the index, the
  // audit log, logs or the job's environment.
  GitAuth git_auth = 5;
  AgentAuth agent_auth = 6;
}

message Job {
  JobSpec spec = 1;
  JobState state = 2;
  bool has_exit_code = 3;
  int32 exit_code = 4;
  int32 pid = 5; // main process of the job
  int32 shim_pid = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
  int64 log_size = 10;
  string reason = 11; // human readable cause for failed/killed/lost
  bool orphaned = 12; // shim died but the process is still alive (read-only adoption)
  string workdir = 13; // prepared worktree (workspace jobs)
}

message GetJobRequest {
  string id = 1;
}

message ListJobsRequest {
  repeated JobState states = 1; // empty = all
  int32 limit = 2; // newest first; 0 = all
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message LogsRequest {
  string id = 1;
  // Byte offset into out.log. Negative = that many bytes before the current end.
  int64 offset = 2;
  bool follow = 3;
  // Sessions.Logs, admins only: another user's session (default: own).
  string owner = 4;
}

message LogChunk {
  int64 offset = 1; // offset of data[0] in out.log
  bytes data = 2;
}

message WaitRequest {
  string id = 1;
}

message KillRequest {
  string id = 1;
}

// ---------------------------------------------------------------- Metrics

service Metrics {
  rpc Snapshot(MetricsRequest) returns (MetricsSnapshot);
  rpc Stream(MetricsStreamRequest) returns (stream MetricsSnapshot);
}

message MetricsRequest {}

message MetricsStreamRequest {
  google.protobuf.Duration interval = 1; // default 2s, min 500ms
}

message ProcGroup {
  string name = 1; // process name without extension
  int32 count = 2;
  uint64 mem_bytes = 3; // working set / RSS sum
  double cpu_percent = 4; // of the whole machine
}

message AgentStat {
  int32 sessions = 1; // leaf processes (no same-name child)
  int32 processes = 2;
  uint64 mem_bytes = 3;
}

message MetricsSnapshot {
  google.protobuf.Timestamp time = 1;
  double cpu_percent = 2;
  int32 threads = 3; // logical CPUs
  uint64 mem_total_bytes = 4;
  uint64 mem_used_bytes = 5;
  int32 jobs_running = 6;
  int64 uptime_seconds = 7;
  int32 nproc = 8;
  map<string, AgentStat> agents = 9; // "claude", "copilot"
  repeated ProcGroup top_cpu = 10;
  repeated ProcGroup top_mem = 11;
  uint64 disk_free_bytes = 12; // volume holding the data dir
  uint64 disk_total_bytes = 13;
}

// ---------------------------------------------------------------- Admin

service Admin {
  // Shutdown stops longarmd gracefully. Jobs keep running in their shims and are
  // re-adopted on the next start. Admin role only.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // Gc removes old terminal jobs and sessions (with their worktrees and
  // staging data) and unused mirrors, like the automatic collector. Admin only.
  rpc Gc(GcRequest) returns (GcResponse);
}

message ShutdownRequest {}

message ShutdownResponse {}

message GcRequest {
  // Remove terminal jobs/sessions that ended longer ago than this
  // (unset = longarmd.toml [gc] keep).
  google.protobuf.Duration keep = 1;
  // Then remove the oldest terminal jobs until this % of the disk is free
  // (0 = longarmd.toml [gc] min_free_percent, negative = skip).
  double min_free_percent = 2;
  bool dry_run = 3;
}

message GcResponse {
  repeated string removed = 1; // "jobs/<id>", "sessions/<name>", "mirrors/<repo>.git", ...
  int64 freed_bytes = 2;
}

// ---------------------------------------------------------------- Sessions

// Sessions are named interactive PTY sessions (ConPTY on Windows, pty on
// Unix), tmux-like: the process lives in a per-session shim, survives client
// disconnects and longarmd restarts, and a re-attach replays recent output from a
// scrollback ring before going live. Several clients may attach at once.
service Sessions {
  // Attach: the first input message must be `open`. The session is created
  // if it does not exist (unless no_create). The first output message is
  // `started`; then `data` until the client detaches (closes its send side or
  // sends detach) or the session's process exits (`exit`, then end).
  rpc Attach(stream AttachInput) returns (stream AttachOutput);
  rpc List(ListSessionsRequest) returns (ListSessionsResponse);
  // Kill terminates the session's whole process tree.
  rpc Kill(KillSessionRequest) returns (Session);
  // Logs streams the session transcript (raw terminal output, secrets
  // redacted) like Jobs.Logs; id = session name.
  rpc Logs(LogsRequest) returns (stream LogChunk);
  // Start creates a session without attaching (InfoResponse feature
  // "session-start"). Idempotent by name: a running session with the same
  // spec is returned with created = false; another spec fails with
  // ALREADY_EXISTS. An ended session of that name is replaced. Returns once
  // the session runs (or ended, e.g. its program did not start), or, with a
  // workspace still being prepared, when the caller's deadline expires.
  rpc Start(StartSessionRequest) returns (AttachStarted);
  // Get returns one session (any state); NOT_FOUND if there is none.
  rpc Get(GetSessionRequest) returns (Session);
  // Send writes bytes to a running session's terminal as one contiguous
  // write (InfoResponse feature "session-send"). The bytes are never
  // persisted (audit: their count only). NOT_FOUND: no such session;
  // FAILED_PRECONDITION: it has ended; RESOURCE_EXHAUSTED: if_idle_ms was
  // set and input arrived within that window (nothing was written).
  rpc Send(SendSessionRequest) returns (SendSessionResponse);
  // Stop ends a session gracefully: Ctrl-C keystrokes to its terminal, then,
  // if it still runs after grace, Kill (InfoResponse feature "session-stop").
  rpc Stop(StopSessionRequest) returns (Session);
}

message AttachInput {
  oneof msg {
    AttachOpen open = 1;
    bytes data = 2; // keyboard input
    TermSize resize = 3;
    bool detach = 4;
  }
}

message AttachOpen {
  string name = 1; // [0-9A-Za-z_-]{1,64}; default "default"
  repeated string argv = 2; // default: the user's shell (pwsh on Windows)
  string cwd = 3;
  map<string, string> env = 4;
  // Injected when the session is created; memory-only, redacted from the
  // transcript on disk. Ignored when attaching to an existing session.
  map<string, string> secret_env = 5;
  TermSize size = 6;
  bool no_create = 7; // fail with NOT_FOUND instead of creating
  bool no_replay = 8; // skip the scrollback replay
  // Admins only: attach to another user's session (default: the caller's).
  string owner = 9;
  AgentAuth agent_auth = 10; // as secret_env: used when the session is created
}

message TermSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message AttachOutput {
  oneof msg {
    AttachStarted started = 1;
    bytes data = 2; // terminal output (raw VT bytes)
    int32 exit_code = 3; // the session's process exited; stream ends
  }
}

message AttachStarted {
  Session session = 1;
  bool created = 2;
}

message Session {
  string name = 1;
  JobState state = 2; // running, done, failed, killed, lost
  repeated string argv = 3;
  string cwd = 4;
  int32 pid = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  bool has_exit_code = 8;
  int32 exit_code = 9;
  int32 attached = 10; // clients currently attached
  int64 log_size = 11;
  string created_by = 12;
  string owner = 13; // the user owning the session
  // The worktree prepared for a session started with a workspace
  // (StartSessionRequest.workspace); removed with the session.
  string workdir = 14;
  JobWorkspace workspace = 15;
  // The session's working directory as the worker resolved it: cwd inside
  // workdir, cwd, or "" (the home directory).
  string dir = 16;
  google.protobuf.Timestamp started_at = 17;
  string reason = 18; // why it failed / was killed / was lost
  // Terminal activity (InfoResponse feature "session-info"; unset for
  // sessions whose shim predates it). input_seq counts the writes to the
  // terminal (an attached client's keystrokes and Sessions.Send); it only
  // grows during the session's life.
  google.protobuf.Timestamp last_output = 19;
  google.protobuf.Timestamp last_input = 20;
  uint64 input_seq = 21;
  string last_input_source = 22; // "attach" | "send" | "stop"
  google.protobuf.Timestamp last_activity = 23; // max(last_output, last_input)
  // The agents whose credentials were forwarded (names, never values).
  repeated string agent_auth = 24;
}

message StartSessionRequest {
  string name = 1; // [0-9A-Za-z_-]{1,64}
  repeated string argv = 2; // default: the user's shell
  string cwd = 3; // with workspace: relative to the worktree
  map<string, string> env = 4;
  // Memory-only on the worker, redacted from the transcript; GH_TOKEN also
  // authenticates a workspace fetch, as for jobs.
  map<string, string> secret_env = 5;
  TermSize size = 6;
  // Prepare a git worktree for the session (like JobSpec.workspace); it
  // lives as long as the session's data ([gc] keep after it ended).
  JobWorkspace workspace = 7;
  // A credential for the fetch of workspace.url only, as
  // SubmitRequest.git_auth (InfoResponse feature "git-auth-forward"):
  // memory-only, never seen by the session's program.
  GitAuth git_auth = 8;
  AgentAuth agent_auth = 9;
}

message GetSessionRequest {
  string name = 1;
  string owner = 2; // admins only: another user's session
}

message SendSessionRequest {
  string name = 1;
  bytes data = 2; // at most 256 KiB, written as is
  // Write only if no input reached the terminal within this many
  // milliseconds (0 = always write).
  uint32 if_idle_ms = 3;
  string owner = 4; // admins only: another user's session
}

message SendSessionResponse {
  uint64 input_seq = 1; // after this write (0: the session's shim predates it)
}

message StopSessionRequest {
  string name = 1;
  // How long to wait after the Ctrl-C keystrokes before killing the
  // process tree (0 = kill at once).
  google.protobuf.Duration grace = 2;
  string owner = 3; // admins only: another user's session
}

message ListSessionsRequest {
  bool all = 1; // include ended sessions
  // Admins see every user's sessions; owner limits the list to one user.
  string owner = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message KillSessionRequest {
  string name = 1;
  string owner = 2; // admins only: another user's session
}

// ---------------------------------------------------------------- Forward

service Forward {
  // Open carries one TCP connection to target on the worker. The first
  // client frame sets target ("127.0.0.1:3131"; a bare port means
  // 127.0.0.1); then data flows both ways. The client half-closes with
  // CloseSend; the worker signals the target's half-close with eof=true and
  // ends the stream once both directions are done.
  rpc Open(stream ForwardFrame) returns (stream ForwardFrame);
  // Ssh is the same byte pipe, connected to longarmd's built-in sshd instead of a
  // TCP target (used by `longarm proxy` as an OpenSSH ProxyCommand). The ssh
  // connection inherits the caller's mTLS identity; no ssh-level auth.
  rpc Ssh(stream ForwardFrame) returns (stream ForwardFrame);
}

message ForwardFrame {
  string target = 1;
  bytes data = 2;
  bool eof = 3;
  SignedPortLinkGrant grant = 4; // LinkTunnel.Dial: first frame
}

// ---------------------------------------------------------------- Files

// Paths are worker paths; relative paths are relative to the home directory
// of longarmd's account. Transfers resume: an interrupted Write leaves
// "<path>.lapart", whose size and sha256 a client learns with Stat(partial)
// and continues from after verifying its own prefix hash.
service Files {
  rpc Stat(FileStatRequest) returns (FileInfo);
  // List walks a directory recursively (symlinks are reported, not followed).
  rpc List(FileListRequest) returns (FileListResponse);
  rpc Read(FileReadRequest) returns (stream FileChunk);
  // Write: header first, then data from header.offset; the file appears
  // atomically at path only after its sha256 matched header.sha256.
  rpc Write(stream FileWriteRequest) returns (FileWriteResult);
  rpc Mkdir(MkdirRequest) returns (FileInfo);
  // Tail streams a file from offset like Read; with follow it then streams
  // what is appended until the client cancels (a missing file is waited
  // for; a file that shrank is read again from 0, signalled by a chunk
  // whose offset is below the previous end). Same access as Read.
  rpc Tail(FileTailRequest) returns (stream FileChunk);
}

message FileTailRequest {
  string path = 1;
  int64 offset = 2; // negative: that many bytes before the current end
  bool follow = 3;
}

message FileStatRequest {
  string path = 1;
  bool partial = 2; // stat "<path>.lapart" instead
  bool hash = 3; // compute sha256
  int64 hash_limit = 4; // hash only the first N bytes (0 = whole file)
}

message FileInfo {
  string path = 1; // as requested (List: relative, '/'-separated)
  string abs_path = 2;
  bool exists = 3;
  bool is_dir = 4;
  bool is_symlink = 5;
  int64 size = 6;
  uint32 mode = 7; // permission bits
  google.protobuf.Timestamp mtime = 8;
  bytes sha256 = 9; // when requested
}

message FileListRequest {
  string path = 1;
}

message FileListResponse {
  string abs_path = 1;
  repeated FileInfo entries = 2; // directories before their contents
}

message FileReadRequest {
  string path = 1;
  int64 offset = 2;
}

message FileChunk {
  int64 offset = 1;
  bytes data = 2;
}

message FileWriteRequest {
  oneof msg {
    FileWriteHeader header = 1;
    bytes data = 2;
  }
}

message FileWriteHeader {
  string path = 1;
  int64 offset = 2; // resume: keep this many bytes of the existing .lapart
  int64 size = 3; // final size
  bytes sha256 = 4; // of the whole final file
  uint32 mode = 5; // 0 = 0644
  google.protobuf.Timestamp mtime = 6;
}

message FileWriteResult {
  string abs_path = 1;
  int64 size = 2;
}

message MkdirRequest {
  string path = 1;
  uint32 mode = 2;
}

// ---------------------------------------------------------------- Workspace

// Code sync (DESIGN §5.3): per-repo bare mirror <data>/mirrors/<repo>.git and
// one git worktree per target directory or job.
service Workspace {
  // Refs lists the commits the worker's mirror has at its ref tips, so the
  // client can bundle only the missing objects.
  rpc Refs(RefsRequest) returns (RefsResponse);
  // Sync uploads a git bundle (may be empty), a binary diff of uncommitted
  // changes and a tar of untracked files, in that order, then either applies
  // them onto a worktree at header.path or stages them for a job.
  rpc Sync(stream SyncChunk) returns (SyncResult);
  // Fetch gets commits into the mirror from a hosted remote, with a
  // forwarded credential: before shipping a local checkout the client has
  // the worker fetch what the remote already has, then sends only the
  // delta ("git-auth-forward").
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

message FetchRequest {
  string repo = 1;
  string url = 2; // https url of the remote
  // Full commit ids to fetch (by id; the worker falls back to fetching the
  // remote's branches when the server refuses that).
  repeated string commits = 3;
  GitAuth git_auth = 4;
}

message FetchResponse {
  // of FetchRequest.commits, those the mirror has now
  repeated string present = 1;
  int64 fetched_ms = 2;
}

message RefsRequest {
  string repo = 1;
  // Git LFS objects (sha256 oids) the client could send (longarm run / sync
  // --lfs ship); the worker answers which of them its mirror already has.
  repeated string lfs_oids = 2;
}

message RefsResponse {
  bool exists = 1;
  repeated string commits = 2;
  // of RefsRequest.lfs_oids, those in the mirror's LFS store (an older
  // worker answers none)
  repeated string lfs_present = 3;
}

message SyncChunk {
  oneof msg {
    SyncHeader header = 1;
    SyncData data = 2;
  }
}

message SyncHeader {
  string repo = 1;
  string commit = 2; // HEAD of the client checkout
  string branch = 3; // informational, e.g. "main"
  string path = 4; // worktree path on the worker (ignored with stage_only)
  bool stage_only = 5; // keep for a job (JobWorkspace.staging_id)
}

enum SyncPart {
  SYNC_PART_UNSPECIFIED = 0;
  SYNC_PART_BUNDLE = 1;
  SYNC_PART_PATCH = 2;
  SYNC_PART_UNTRACKED_TAR = 3;
  // Git LFS objects for the mirror's LFS store: a tar of files named by
  // their sha256 oid (--lfs ship)
  SYNC_PART_LFS_TAR = 4;
}

message SyncData {
  SyncPart part = 1;
  bytes data = 2;
}

message SyncResult {
  string path = 1;
  string commit = 2;
  string staging_id = 3;
  int64 bundle_bytes = 4;
  int64 patch_bytes = 5;
  int64 untracked_bytes = 6;
  int64 lfs_bytes = 7;
}

// ---------------------------------------------------------------- UserHelper

// UserHelper is internal to longarmd with per-user isolation: for every
// Files / Workspace call, job preparation and cleanup in a user's data,
// longarmd starts `longarmd user-helper` as that user's OS account and talks
// gRPC to it over the helper's stdin/stdout (the helper also serves Files
// and Workspace there). It is never served on a network listener, so the
// file system is only ever touched with the user's own rights.
service UserHelper {
  // PrepareJob fetches / imports into the user's mirror and creates the
  // job's worktree; log lines stream back, the last message has workdir.
  rpc PrepareJob(PrepareJobRequest) returns (stream PrepareJobOutput);
  // Prune runs `git worktree prune` in every mirror of the user.
  rpc Prune(PruneRequest) returns (PruneResponse);
}

message PrepareJobRequest {
  string job_id = 1;
  JobWorkspace workspace = 2;
  map<string, string> secret_env = 3; // GH_TOKEN authenticates https fetches
  GitAuth git_auth = 4; // forwarded credential for workspace.url
}

message PrepareJobOutput {
  bytes log = 1;
  string workdir = 2; // final message
}

message PruneRequest {}

message PruneResponse {}

// ---------------------------------------------------------------- Port links

// LinkTunnel is the data path of a port link (docs/usage.md "Port links"):
// processes on worker A reach a loopback port of worker B at
// 127.0.0.1:<listen_port> on A. A's longarmd dials B with its worker
// certificate and calls Dial once per accepted connection.
//
// Worker certificates may call nothing else on a worker, and Dial only
// with a grant the hub signed for this exact link (from = the caller's
// certificate name, to = this worker), unexpired and still in the list of
// active links the hub pushed to this worker. The target is always
// 127.0.0.1:<grant.port> and passes the same checks as Forward.Open for
// the link's owner (per-user isolation: a process of the owner's account
// listens on it).
service LinkTunnel {
  // Dial: the first frame carries the grant; the worker answers with an
  // empty frame once it accepted the link and connected to the target (an
  // error otherwise: FailedPrecondition = the link is not in its list
  // (yet), the caller may retry briefly); then bytes flow both ways like
  // Forward.Open.
  rpc Dial(stream ForwardFrame) returns (stream ForwardFrame);
}

// PortLinkGrant is what the hub signs for a port link (SignedPortLinkGrant).
message PortLinkGrant {
  string id = 1;
  string owner = 2; // the user who created the link
  string from = 3; // worker A: its certificate name (listens, dials B)
  string to = 4; // worker B: its certificate name (the target)
  int32 port = 5; // target port on B (127.0.0.1)
  int32 listen_port = 6; // 127.0.0.1:<listen_port> on A
  int64 expires_unix = 7; // seconds
  int64 issued_unix = 8;
  // the ends' node IDs: B accepts only a caller whose certificate is
  // from_id, and only a grant whose to_id is its own (a worker-to-worker
  // grant binds immutable IDs, not names)
  string from_id = 9;
  string to_id = 10;
}

// SignedPortLinkGrant: the hub's signature over a serialized PortLinkGrant
// with the key of its hub certificate (role hub, issued by the fleet CA,
// which every worker trusts already).
message SignedPortLinkGrant {
  bytes grant = 1; // serialized PortLinkGrant
  // ECDSA (ASN.1) / Ed25519 signature over
  // SHA-256("longarm port-link grant v1\x00" || grant)
  bytes signature = 2;
  repeated bytes chain = 3; // DER: the hub certificate first, then intermediates
}

// ---------------------------------------------------------------- MachineUpdate

// MachineUpdate updates the machine a worker runs on to a newer signed
// release (`longarm worker update`, the tray's "Update to X";
// docs/usage.md "Updating"). Only the worker's owner (a client or admin
// certificate of an owner) may call it, end to end: the hub has no command
// that reaches it. An MSI install forwards the request to the LongarmUpdate
// service (Windows; it installs the hub's newer, signed MSI and nothing
// else), other installs run longarmd's own self-update for that version.
service MachineUpdate {
  // Start installs request's version (or the hub's latest stable) and
  // streams the progress. With an MSI the worker itself restarts while the
  // installer runs: the stream then ends with phase "installing" and the
  // caller reconnects (Status, Node.Info's version) for the result.
  rpc Start(MachineUpdateRequest) returns (stream MachineUpdateEvent);
  // Status: installed / available versions, an update in progress, the
  // last result and the auto-update setting.
  rpc Status(MachineUpdateStatusRequest) returns (MachineUpdateEvent);
  // SetAuto turns automatic updates on or off (MSI installs only; the
  // owner or a local administrator, never the hub).
  rpc SetAuto(MachineUpdateAutoRequest) returns (MachineUpdateEvent);
}

message MachineUpdateRequest {
  string version = 1; // a version the hub has; "" with latest
  bool latest = 2; // the hub's latest stable release
}

message MachineUpdateStatusRequest {}

message MachineUpdateAutoRequest {
  bool enabled = 1;
  int32 interval_hours = 2; // 0 = the default (6)
}

message MachineUpdateEvent {
  // checking | downloading | verifying | installing | restarting | done |
  // up_to_date | failed | status
  string phase = 1;
  string message = 2;
  string from = 3;
  string to = 4;
  string method = 5; // msi (the LongarmUpdate service) | self (longarmd's self-update)
  // what ran when the update started (the caller counts what kept running)
  repeated string running_jobs = 6;
  repeated string running_sessions = 7;
  string error = 8;
  // why it failed: denied | refused (downgrade, not for this machine) |
  // not_found | busy | rate_limited | unavailable | unsupported | invalid
  string code = 9;
  bool auto = 10;
  int32 auto_interval_hours = 11;
  string installed = 12;
  string available = 13; // the hub's latest stable ("" = unknown)
  google.protobuf.Timestamp at = 14;
  // the last finished update on this machine
  string last_from = 15;
  string last_to = 16;
  bool last_ok = 17;
  string last_error = 18;
  google.protobuf.Timestamp last_at = 19;
}
