<!doctype html>
<!-- The loader: starts the Go core (the LongarmCore plugin) and opens its
     page (docs/mobile.md). -->
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Longarm</title></head>
<body style="font: 16px -apple-system, system-ui, sans-serif; display: flex; height: 100vh; margin: 0; align-items: center; justify-content: center; color: #555; padding: 0 24px; text-align: center">
  <div id="msg">Starting Longarm…</div>
  <script>
    window.Capacitor.Plugins.LongarmCore.start()
      .then((r) => location.replace(r.url))
      .catch((e) => { document.getElementById('msg').textContent = 'Longarm could not start: ' + (e.message || e) })
  </script>
</body>
</html>
