# The releases of the Microsoft-internal copy: THIS FILE BELONGS IN
# gim-home/longarm as .github/workflows/sync-releases.yml (committed there
# once; it is kept here, outside .github/workflows, so it never runs in the
# public repository). docs/ci-cd.md "Internal mirror (gim-home)".
#
# Every 30 minutes it copies the public repository's newest releases that
# gim-home lacks - the same tags, the same files - with gim-home's own
# GITHUB_TOKEN: the public releases need no token to read, so no personal
# access token is involved. The work is the public repository's
# .github/scripts/gim-sync-releases.sh (fetched from its main at each run),
# so changes there need nothing here.
name: sync-releases

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Only this release (e.g. v0.1.28); empty = the newest ones
        type: string
        default: ""
      count:
        description: How many of the newest releases to check
        type: string
        default: "5"

permissions:
  contents: write # create the releases and upload their files

concurrency:
  group: sync-releases
  cancel-in-progress: false

env:
  SRC: github.com/lubobill1990/longarm

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: copy the public releases
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TAG: ${{ inputs.tag }}
          SYNC_COUNT: ${{ inputs.count || '5' }}
        run: |
          export SRC_REPO="$SRC"
          gh api "repos/${SRC#github.com/}/contents/.github/scripts/gim-sync-releases.sh?ref=main" \
            -H "Accept: application/vnd.github.raw" >"$RUNNER_TEMP/sync.sh"
          bash "$RUNNER_TEMP/sync.sh"
