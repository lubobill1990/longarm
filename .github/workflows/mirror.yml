# Verifies the third-party images of deploy/azure (deploy/azure/mirror-images.txt),
# read-only, on every pull request that changes the list and on main:
#   each line's source is an allowed repository (ALLOWED_SOURCES, here - not in
#   the PR-editable list), its pinned digest resolves at the source and the
#   manifest hashes to it; prints where deploy.sh --acr NAME imports it.
#
# Nothing is published from here any more: deploy.sh --acr NAME imports the
# pinned digests into the hub's Azure Container Registry itself (az acr import,
# before anything is deleted) and the sidecars are pulled from there with the
# managed identity (deploy/azure/README.md "Third-party images"). The GHCR
# package longarm-mirror is retired: publishing it failed (DENIED) and ACI
# would have needed it public.
name: mirror

on:
  pull_request:
    paths:
      - deploy/azure/mirror-images.txt
      - .github/workflows/mirror.yml
  push:
    branches: [main]
    paths:
      - deploy/azure/mirror-images.txt
      - .github/workflows/mirror.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

env:
  # the only repositories that may be mirrored
  ALLOWED_SOURCES: docker.io/library/caddy docker.io/headscale/headscale
  CRANE_URL: https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  verify:
    name: verify the pinned images (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: crane (pinned, sha256-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          LONGARM_TOOLS=$RUNNER_TEMP/tools .github/scripts/fetch-tool.sh crane v0.22.1 "$CRANE_URL" "$CRANE_SHA256" crane
      - name: verify, and where deploy.sh --acr imports each image
        run: |
          n=0
          while read -r src extra; do
            [[ -z $src || $src == \#* ]] && continue
            [[ -z $extra ]] || { echo "::error::one image per line, nothing after it: $src $extra"; exit 1; }
            [[ $src =~ ^([a-z0-9./-]+):([A-Za-z0-9._-]+)@(sha256:[0-9a-f]{64})$ ]] || { echo "::error::want <repository>:<tag>@sha256:<digest>: $src"; exit 1; }
            repo=${BASH_REMATCH[1]} digest=${BASH_REMATCH[3]}
            [[ " $ALLOWED_SOURCES " == *" $repo "* ]] || { echo "::error::$repo is not an allowed source (ALLOWED_SOURCES in mirror.yml)"; exit 1; }
            # by digest: the registry serves the manifest whose sha256 is that digest
            got=$(crane digest "$repo@$digest")
            [[ $got == "$digest" ]] || { echo "::error::$src: the source resolves to $got"; exit 1; }
            # the tag may have moved since it was pinned: worth knowing, not an error
            now=$(crane digest "${src%%@*}" 2>/dev/null || true)
            [[ $now == "$digest" ]] || echo "::notice::${src%%@*} now points to ${now:-nothing}; the pinned $digest is deployed"
            name=${repo#docker.io/}
            echo "ok: $src -> <acr>.azurecr.io/mirror/${name#library/}:${digest#sha256:}@$digest"
            n=$((n + 1))
          done <deploy/azure/mirror-images.txt
          ((n > 0)) || { echo "::error::no images in deploy/azure/mirror-images.txt"; exit 1; }

