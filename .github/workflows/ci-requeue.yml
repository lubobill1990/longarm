# Re-queues ci.yml jobs GitHub never started. Hosted macOS (arm64) runners
# are short at times: a job that gets no runner ends "cancelled" ("The job
# was not acquired by Runner of type hosted even after multiple attempts")
# and fails the required "tests" check though nothing was tested. When a
# failed ci run has such jobs and no job that ran and failed, this re-runs
# them (and "tests" with them), up to 3 attempts per run
# (.github/scripts/ci-requeue.sh). Jobs that failed for real are never
# re-run here. workflow_run runs this file from main, with main's script.
name: ci-requeue

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write # gh run rerun
  contents: read

jobs:
  requeue:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: re-run jobs GitHub never started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: .github/scripts/ci-requeue.sh "$RUN_ID" "$ATTEMPT"
