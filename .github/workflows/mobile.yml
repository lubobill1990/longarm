# The Longarm phone app (docs/mobile.md): the Go core bound with gomobile
# (mobile/core) and the Capacitor app (mobile/app) built for Android (an
# APK) and the iOS simulator - launched there, its screen an artifact.
name: mobile

on:
  pull_request:
    paths: ['mobile/**', 'internal/mobile/**', 'internal/termws/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'internal/mobile/**', 'internal/termws/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Go core (gomobile bind)
        working-directory: mobile
        run: |
          v=$(go list -m -f "{{.Version}}" golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$v" golang.org/x/mobile/cmd/gobind@"$v"
          export JAVA_HOME="$JAVA_HOME_21_X64" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p app/android/app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -ldflags '-s -w' -o app/android/app/libs/longarm.aar ./core
          ls -l app/android/app/libs
      - name: App
        working-directory: mobile/app
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          npm ci
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon -q
          ls -l app/build/outputs/apk/debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: longarm-android-debug
          path: mobile/app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Go core (gomobile bind)
        working-directory: mobile
        run: |
          v=$(go list -m -f "{{.Version}}" golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$v" golang.org/x/mobile/cmd/gobind@"$v"
          gomobile bind -target=ios,iossimulator -ldflags '-s -w' -o app/plugins/longarm-core/ios/Longarm.xcframework ./core
          du -sh app/plugins/longarm-core/ios/Longarm.xcframework/*/*
      - name: App (simulator)
        working-directory: mobile/app
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Run in the simulator
        working-directory: mobile/app
        run: |
          dev=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --stdout="$PWD/app-stdout.log" --stderr="$PWD/app-stderr.log" "$dev" dev.longarm.app
          for s in 20 60; do
            sleep $(( s - ${prev:-0} )); prev=$s
            xcrun simctl io "$dev" screenshot "ios-simulator-${s}s.png"
          done
          xcrun simctl spawn "$dev" launchctl list | grep -i longarm || echo "the app is not running"
          xcrun simctl spawn "$dev" log show --last 4m --style compact \
            --predicate 'process == "App" OR process CONTAINS "WebContent" OR eventMessage CONTAINS "longarm"' > app.log || true
          grep -E "LongarmCore|didFail" app.log | tail -20
          echo "--- stdout"; cat app-stdout.log || true; echo "--- stderr"; tail -50 app-stderr.log || true
          cp ~/Library/Logs/DiagnosticReports/App* . 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: longarm-ios-simulator
          path: |
            mobile/app/ios-simulator-*.png
            mobile/app/app.log
            mobile/app/App*.ips
            mobile/app/app-std*.log

  # A signed build to TestFlight (main and manual runs; docs/mobile.md
  # "TestFlight"). The app id, team and signing material come from the
  # repository's variables and secrets, not the tree.
  testflight:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      APP_ID: ${{ vars.LONGARM_IOS_APP_ID }}
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      P12: ${{ secrets.APPLE_IOS_DIST_P12 }}
      P12_PASSWORD: ${{ secrets.APPLE_IOS_DIST_P12_PASSWORD }}
      PROFILE: ${{ secrets.APPLE_IOS_PROFILE }}
      ASC_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      ASC_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Configured?
        id: cfg
        run: |
          if [ -n "$APP_ID" ] && [ -n "$TEAM" ] && [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$ASC_KEY" ]; then
            echo "ok=1" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight not configured (vars LONGARM_IOS_APP_ID, APPLE_TEAM_ID; secrets APPLE_IOS_DIST_P12, APPLE_IOS_PROFILE, APPLE_NOTARY_*)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.ok
        with:
          persist-credentials: false
          fetch-depth: 0 # the version from the tags
      - uses: ./.github/actions/go-setup
        if: steps.cfg.outputs.ok
        with:
          cache: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cfg.outputs.ok
        with:
          node-version: '22'
      - name: Go core (gomobile bind, devices)
        if: steps.cfg.outputs.ok
        working-directory: mobile
        run: |
          v=$(go list -m -f "{{.Version}}" golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$v" golang.org/x/mobile/cmd/gobind@"$v"
          gomobile bind -target=ios -ldflags '-s -w' -o app/plugins/longarm-core/ios/Longarm.xcframework ./core
      - name: Signing
        if: steps.cfg.outputs.ok
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 -d >"$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046 # the keychain list, one path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d >"$RUNNER_TEMP/app.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          name=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "PROFILE_NAME=$name" >>"$GITHUB_ENV"
          printf '%s' "$ASC_KEY" >"$RUNNER_TEMP/asc.p8"
      - name: Archive and upload
        if: steps.cfg.outputs.ok
        working-directory: mobile/app
        run: |
          # The App target only (the Swift packages are not signed): the
          # real app id, manual signing, the version (the last tag's
          # x.y.z) and a build number that only grows (the run number).
          ver=$(git describe --tags --abbrev=0 --match 'v[0-9]*' | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          sed -i '' -e "s/PRODUCT_BUNDLE_IDENTIFIER = dev.longarm.app;/PRODUCT_BUNDLE_IDENTIFIER = $APP_ID; DEVELOPMENT_TEAM = $TEAM; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e "s/MARKETING_VERSION = 1.0;/MARKETING_VERSION = $ver;/" \
            -e "s/CURRENT_PROJECT_VERSION = 1;/CURRENT_PROJECT_VERSION = $GITHUB_RUN_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Longarm.xcarchive" archive -quiet
          cat >"$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$APP_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Longarm.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER"
          echo "::notice::uploaded Longarm $ver ($GITHUB_RUN_NUMBER) to TestFlight"
      - name: Clean up
        if: always() && steps.cfg.outputs.ok
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/app.mobileprovision"
