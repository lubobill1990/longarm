# The Longarm phone app (docs/mobile.md): the Go core bound with gomobile
# (mobile/core) and the Capacitor app (mobile/app) built for Android (an
# APK) and the iOS simulator - launched there, its screen an artifact.
name: mobile

on:
  pull_request:
    paths: ['mobile/**', 'internal/mobile/**', 'internal/termws/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'internal/mobile/**', 'internal/termws/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Go core (gomobile bind)
        working-directory: mobile
        run: |
          v=$(go list -m -f "{{.Version}}" golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$v" golang.org/x/mobile/cmd/gobind@"$v"
          export JAVA_HOME="$JAVA_HOME_21_X64" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p app/android/app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -ldflags '-s -w' -o app/android/app/libs/longarm.aar ./core
          ls -l app/android/app/libs
      - name: App
        working-directory: mobile/app
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          npm ci
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon -q
          ls -l app/build/outputs/apk/debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: longarm-android-debug
          path: mobile/app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Go core (gomobile bind)
        working-directory: mobile
        run: |
          v=$(go list -m -f "{{.Version}}" golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$v" golang.org/x/mobile/cmd/gobind@"$v"
          gomobile bind -target=ios,iossimulator -ldflags '-s -w' -o app/plugins/longarm-core/ios/Longarm.xcframework ./core
          du -sh app/plugins/longarm-core/ios/Longarm.xcframework/*/*
      - name: App (simulator)
        working-directory: mobile/app
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Run in the simulator
        working-directory: mobile/app
        run: |
          dev=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --stdout="$PWD/app-stdout.log" --stderr="$PWD/app-stderr.log" "$dev" dev.longarm.app
          for s in 20 60; do
            sleep $(( s - ${prev:-0} )); prev=$s
            xcrun simctl io "$dev" screenshot "ios-simulator-${s}s.png"
          done
          xcrun simctl spawn "$dev" launchctl list | grep -i longarm || echo "the app is not running"
          xcrun simctl spawn "$dev" log show --last 4m --style compact \
            --predicate 'process == "App" OR process CONTAINS "WebContent" OR eventMessage CONTAINS "longarm"' > app.log || true
          grep -E "LongarmCore|didFail" app.log | tail -20
          echo "--- stdout"; cat app-stdout.log || true; echo "--- stderr"; tail -50 app-stderr.log || true
          cp ~/Library/Logs/DiagnosticReports/App* . 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: longarm-ios-simulator
          path: |
            mobile/app/ios-simulator-*.png
            mobile/app/app.log
            mobile/app/App*.ips
            mobile/app/app-std*.log
