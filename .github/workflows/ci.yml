# CI on GitHub-hosted runners (docs/ci-cd.md).
#   lint:    privacy check, gofmt, go vet, cross-compile 6 targets, shellcheck, actionlint
#   azure:   deploy/azure: bicep build (azuredeploy.json up to date) + lint, ACI rules
#            (deploy/azure/test/acirules), PSScriptAnalyzer
#   web:     web/ (the hub panel / tray UI): pnpm typecheck, unit tests, build
#   (the hub image and its docker smoke test: image.yml)
#   test:    full go test on ubuntu-latest, windows-latest and macos-latest, each
#            split into parallel jobs (unit, e2e-1..3)
#   tests:   one check for branch protection / auto-merge: every test job passed
# Pull requests from forks run with a read-only token and no secrets (the
# privacy check then skips its private deny-list).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR / branch cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Opt-in tests (services, MSI, live tailnets, browsers) stay off in CI.
  LONGARM_SERVICE_TEST: ""
  LONGARM_PERUSER_TEST: "" # set in the per-user steps below
  LONGARM_MSI_TEST: ""
  LONGARM_PLAYWRIGHT: ""
  LONGARM_SCREENSHOTS: ""
  LONGARM_GITHUB_TEST: ""
  LONGARM_HEADSCALE_BIN: ""
  LONGARM_HEADSCALE_DATAPATH: ""
  LONGARM_TAILSCALE_OAUTH_SECRET_FILE: ""
  LONGARM_TRAY_CGO: ""
  TS_AUTHKEY: ""

jobs:
  lint:
    name: lint (privacy, fmt, vet, cross-compile, shellcheck, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: privacy check
        env:
          # The deny-list is a secret (publishing it would publish what it
          # protects); fork PRs don't get it and run the generic checks only.
          LONGARM_PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
          LONGARM_PRIVACY_REQUIRED: ${{ github.event_name == 'push' && '1' || '' }}
        run: scripts/privacy-check.sh
      - uses: ./.github/actions/go-setup
      - name: gitleaks
        run: |
          gl=$(.github/scripts/fetch-tool.sh gitleaks v8.30.1 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks)
          "$gl/gitleaks" git --redact --no-banner --exit-code 1 .
          "$gl/gitleaks" dir --redact --no-banner --exit-code 1 .
      - name: gofmt
        run: |
          bad=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$bad" ]; then
            echo "::error::gofmt -w needed:"
            echo "$bad"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: cross-compile (vet, build, e2e test binary) for 6 targets
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "::group::$t"
            export GOOS=${t%/*} GOARCH=${t#*/}
            go vet ./...
            go build -o /dev/null ./...
            go test -c -o /dev/null ./e2e
            echo "::endgroup::"
          done
      - name: shellcheck
        run: |
          sc=$(.github/scripts/fetch-tool.sh shellcheck v0.11.0 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 shellcheck-v0.11.0/shellcheck)
          "$sc/shellcheck" deploy/hub/longarm-hub-deploy .github/scripts/*.sh scripts/*.sh \
            packaging/build.sh packaging/linux/*.sh packaging/macos/*.sh packaging/macos/scripts/* \
            deploy/azure/*.sh deploy/azure/test/*.sh deploy/hub/image-build.sh
      - name: actionlint
        # shellcheck (on PATH from the step above) also checks the run: scripts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  azure:
    name: azure template (bicep, ACI rules, PSScriptAnalyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bicep build + lint (pinned bicep CLI)
        run: |
          bicep=$RUNNER_TEMP/bicep
          curl -fsSL --retry 3 -o "$bicep" https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          echo "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  $bicep" | sha256sum -c -
          chmod +x "$bicep"
          "$bicep" build deploy/azure/main.bicep --outfile "$RUNNER_TEMP/azuredeploy.json" 2>&1 | tee "$RUNNER_TEMP/bicep.log"
          if ! diff -u deploy/azure/azuredeploy.json "$RUNNER_TEMP/azuredeploy.json"; then
            echo "::error::deploy/azure/azuredeploy.json is stale: bicep build deploy/azure/main.bicep --outfile deploy/azure/azuredeploy.json"
            exit 1
          fi
          "$bicep" lint deploy/azure/main.bicep 2>&1 | tee -a "$RUNNER_TEMP/bicep.log"
          if [ -s "$RUNNER_TEMP/bicep.log" ]; then
            echo "::error::bicep reported warnings"
            exit 1
          fi
      - uses: ./.github/actions/go-setup
      - name: ACI rules (ports, memory/CPU steps, env, volumes) for every parameter combination
        run: go run ./deploy/azure/test/acirules deploy/azure/azuredeploy.json
      - name: PSScriptAnalyzer (deploy/azure/deploy.ps1)
        shell: pwsh
        run: |
          # the PowerShell Gallery fails now and then ("No match was found"): retry
          for ($i = 1; ; $i++) {
            try { Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -ErrorAction Stop; break }
            catch { if ($i -ge 4) { throw }; Write-Warning "Install-Module: $_ (retry $i)"; Start-Sleep -Seconds (15 * $i) }
          }
          $r = Invoke-ScriptAnalyzer -Path deploy/azure/deploy.ps1 -Settings deploy/azure/PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
          if ($r) { throw "PSScriptAnalyzer: $(@($r).Count) findings" }

  web:
    name: web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm (corepack)
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test
      # internal/webui/dist (the embedded panel) is built by `node web/build.mjs`
      # and checked in; this only proves the toolchain still builds it
      - name: build
        run: pnpm build
      # the built panel, for updating internal/webui/dist where npm's
      # registry isn't reachable (gh run download -n webui-dist)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webui-dist
          path: web/dist
          retention-days: 7

  # One job per OS and part: "unit" is every package but ./e2e plus the
  # per-user isolation tests; e2e-1..3 split ./e2e's top-level tests
  # (.github/scripts/test-shard.sh), its longest package by far.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        part: [unit, e2e-1, e2e-2, e2e-3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # = bash -eo pipefail: "go test | tee" fails when go test does
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: go build
        if: matrix.part == 'unit'
        run: go build ./...
      - name: go test (all packages but ./e2e)
        if: matrix.part == 'unit'
        run: |
          # shellcheck disable=SC2046 # package paths have no spaces
          go test -count=1 -timeout 30m $(go list ./... | grep -v '/e2e$') 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: go test ./e2e (${{ matrix.part }})
        if: startsWith(matrix.part, 'e2e-')
        env:
          PART: ${{ matrix.part }}
        run: |
          run=$(.github/scripts/test-shard.sh ./e2e "${PART#e2e-}" 3)
          echo "$run"
          go test -count=1 -timeout 30m -run "$run" ./e2e 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      # Multi-tenancy with OS-level per-user isolation (docs/security.md):
      # longarmd as root / LocalSystem creating temporary accounts - only on
      # throwaway runners. Linux: the e2e test binary runs as root with
      # binaries built beforehand (root has no Go caches); Windows: the
      # runner is an administrator (the test installs a temporary service).
      - name: per-user isolation (root)
        if: runner.os == 'Linux' && matrix.part == 'unit'
        run: |
          bin="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$bin"
          for c in longarmd longarm longarm-hub; do go build -o "$bin/$c" "./cmd/$c"; done
          go build -o "$bin/helper" ./e2e/helper
          go test -c -o "$bin/e2e.test" ./e2e
          # loopback isolation between the accounts needs nft (the tests
          # skip it with a warning if it can't be installed)
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables; } ||
            echo "::warning::nftables not installed: loopback isolation is not tested"
          go test -c -o "$bin/loopguard.test" ./internal/loopguard
          sudo "$bin/loopguard.test" -test.v 2>&1 | tee -a "$RUNNER_TEMP/go-test.log"
          # root's data dir checks and the enrollment migration (root-only cases)
          go test -c -o "$bin/longarmd.test" ./internal/longarmd
          sudo "$bin/longarmd.test" -test.run 'DataDir|Migrate|RootHome' -test.v 2>&1 | tee -a "$RUNNER_TEMP/go-test.log"
          cd e2e
          sudo env LONGARM_PERUSER_TEST=1 LONGARM_E2E_BIN_DIR="$bin" LONGARM_GATE_CPU=101 LONGARM_GATE_FREE_GB=0 \
            "$bin/e2e.test" -test.run 'PerUser' -test.v -test.timeout 15m 2>&1 | tee -a "$RUNNER_TEMP/go-test.log"
      - name: per-user isolation (administrator)
        if: runner.os == 'Windows' && matrix.part == 'unit'
        env:
          LONGARM_PERUSER_TEST: "1"
        run: |
          go test -count=1 -run 'DataDir|Migrate|LockedDACL' -v ./internal/longarmd ./internal/platform/windows 2>&1 | tee -a "$RUNNER_TEMP/go-test.log"
          go test -count=1 -timeout 15m -run 'PerUser' -v ./e2e 2>&1 | tee -a "$RUNNER_TEMP/go-test.log"
      - name: upload test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-${{ matrix.os }}-${{ matrix.part }}
          path: ${{ runner.temp }}/go-test.log
          if-no-files-found: ignore
          retention-days: 14

  # The required check (ruleset of main): the matrix's job names change with
  # its parts, this one doesn't.
  tests:
    name: tests
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every test job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix: $RESULT"
          [ "$RESULT" = success ]
