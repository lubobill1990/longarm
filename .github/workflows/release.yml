# Release on a v* tag (docs/ci-cd.md "Cutting a release"), and a dev build
# on every push to main (docs/ci-cd.md "Release channels").
#
#   meta           ubuntu-latest: validates the tag (stable tags only from main)
#   build-unix     ubuntu-latest: goreleaser (LONGARM_BUILD_SIDE=unix: linux +
#                  darwin binaries, archives, deb/rpm) + packaging/hubrelease
#   build-windows  windows-latest: packaging/build.ps1 -Side windows (the Windows
#                  binaries + archives, the MSIs) + packaging/hubrelease
#                  Both: the repository variable LONGARM_UPDATE_PUBKEY (if set)
#                  is built into longarmd (without it the binaries have
#                  self-update turned off), and LONGARM_DEFAULT_HUB (+ _CA) into
#                  the binaries and the MSI's "Default" choice (without it:
#                  Custom only). No secrets, no caches saved.
#   publish        ubuntu-latest: merges the two build artifacts (one checksums.txt)
#                  and checks the file names (.github/scripts/release-files.sh);
#                  signs with the secret LONGARM_RELEASE_KEY (if set),
#                  upload to the hub with the release-role certificate (only when
#                  the variable LONGARM_HUB is set), then the GitHub Release
#   image          ubuntu-latest (image.yml), next to the builds (it doesn't use
#                  their output): smoke test, then ghcr.io/<owner>/longarm-hub:X.Y.Z
#   image-latest   after publish and image, stable releases: :latest -> :X.Y.Z
#   hub            longarm-hub update over SSH (forced command longarm-hub-deploy:
#                  verify, install, health check, roll back); needs LONGARM_HUB + HUB_SSH
#   rollout        longarm admin release push <v> --canary 1 --wait 15m; fails when
#                  the rollout halts; a warning (not a failure) when no worker
#                  can self-update (--allow-none, exit 79: MSI workers update
#                  through the tray's banner); needs LONGARM_HUB
#
# Dry run (Actions -> release -> Run workflow, any branch): meta, both builds,
# gather (publish's merge and check, no secrets) and the image smoke test,
# with the version <last tag>-dryrun.<run> (a local tag, never pushed);
# nothing is signed, published, pushed or deployed, and it doesn't queue
# behind (or block) a real release.
#
# Without a deployment (forks, or the repository without the variables) the
# workflow still builds and publishes a GitHub Release; hub and rollout are
# skipped.
#
# Order: hub BEFORE the fleet. The control plane goes first (like Kubernetes'
# version skew rule: control plane >= nodes): the new hub serves both the old
# and the new longarmd, a new longarmd never has to talk to an older hub, the
# rollout itself is run by the new hub, and the hub's restart (workers
# reconnect) can never land inside the canary's health window. A failed hub
# deploy rolls back by itself and stops the workflow before any worker is
# touched.
#
# Channels (internal/update/channel.go): a stable tag vX.Y.Z -> stable;
# a prerelease tag (v1.2.3-rc.1, any "-" suffix) -> preview, a GitHub
# prerelease; a push to main -> dev, version <next patch>-dev.<run number>
# (the next patch after the highest version tagged so far, so dev builds sort
# after its release candidates and before the next release), no GitHub
# Release, no versioned image. Preview and dev: no hub deploy, no fleet
# rollout - machines on those channels pick them up through the tray's
# banner, the update service's automatic updates or longarm worker update.
#
# Isolation: no job saves a cache; the Go jobs start from fresh module caches
# and restore only the build cache that ci.yml saves on pushes to main
# (.github/actions/go-build-cache; never a pull request's). The longarm that
# handles the signing key and the release certificate is built from the tag's
# source in the job itself, never taken from the build artifact. To require a
# manual approval before anything is signed or deployed, see docs/ci-cd.md
# "Approval gate".
name: release

on:
  push:
    tags: ["v*"]
    # dev builds; path filters don't apply to tag pushes
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "web/shots/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run: build everything and gather the artifacts; no signing,
          publishing, hub, rollout or image push (a manual run is always one)
        type: boolean
        default: true

permissions:
  contents: read

# One release (or deploy.yml) at a time; never cancel a running one. Dry runs
# queue per branch, dev builds among themselves (GitHub keeps one pending
# run per group: a burst of merges builds the first and the newest), apart
# from releases.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('longarm-release-dry-run-{0}', github.ref) || (github.ref_type == 'branch' && 'longarm-release-dev' || 'longarm-release') }}
  cancel-in-progress: false

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      dev: ${{ steps.meta.outputs.dev }}
      # the build jobs tag HEAD themselves (dry runs, dev builds; never pushed)
      local_tag: ${{ steps.meta.outputs.local_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the last tag, main
          persist-credentials: false
      - name: version, channel
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBKEY: ${{ vars.LONGARM_UPDATE_PUBKEY }}
          DEFAULT_HUB: ${{ vars.LONGARM_DEFAULT_HUB }}
        run: |
          dry=false
          dev=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then
            # a dev build of main: the next patch after the highest version
            # tagged so far (stable or prerelease)
            dev=true
            top=$(git tag -l 'v[0-9]*' | sed -E 's/^v//; s/[-+].*$//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)
            IFS=. read -r major minor patch <<<"${top:-0.0.0}"
            TAG="v$major.$minor.$((patch + 1))-dev.$GITHUB_RUN_NUMBER"
            echo "dev build $TAG of $(git rev-parse --short HEAD) (a local tag of the build jobs, never pushed)"
          elif [ "$EVENT" = workflow_dispatch ]; then
            if [ "$DRY_RUN" != true ]; then
              echo "::error::a manual run is a dry run only: releases come from v* tags"
              exit 1
            fi
            dry=true
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            TAG="${last%%-*}-dryrun.$GITHUB_RUN_NUMBER"
            echo "dry run as $TAG (a local tag of the build jobs, never pushed)"
          fi
          re='^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z][0-9A-Za-z.]{0,31})?$'
          if ! [[ $TAG =~ $re ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          pre=false
          if [ -n "${BASH_REMATCH[2]}" ]; then pre=true; fi
          if [ "$dev" = false ] && [[ ${BASH_REMATCH[2]} == -dev* ]]; then
            echo "::error::$TAG: dev versions come from pushes to main, not tags"
            exit 1
          fi
          # stable releases only from main
          if [ "$pre" = false ] && ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          if [ -z "$PUBKEY" ]; then
            echo '::warning::repository variable LONGARM_UPDATE_PUBKEY is not set: the binaries are built with self-update turned off (docs/ci-cd.md)'
          fi
          if [ -z "$DEFAULT_HUB" ]; then
            echo '::warning::repository variable LONGARM_DEFAULT_HUB is not set: no built-in hub - the MSI offers Custom only and login needs a hub argument (docs/ci-cd.md)'
          fi
          channel=stable
          if [ "$pre" = true ]; then channel=preview; fi
          if [ "$dev" = true ]; then channel=dev; fi
          local_tag=false
          if [ "$dry" = true ] || [ "$dev" = true ]; then local_tag=true; fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "prerelease=$pre"
            echo "channel=$channel"
            echo "dry_run=$dry"
            echo "dev=$dev"
            echo "local_tag=$local_tag"
          } >>"$GITHUB_OUTPUT"

  build-unix:
    name: build (Linux, macOS)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      GORELEASER_CURRENT_TAG: ${{ needs.meta.outputs.tag }}
      LONGARM_BUILD_SIDE: unix
      CGO_ENABLED: "0" # as .goreleaser.yaml; also hubrelease (main's build cache)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser: changelog, previous tag
          persist-credentials: false
      - name: local tag (dry run, dev build)
        if: needs.meta.outputs.local_tag == 'true'
        run: git tag "$TAG"
      - uses: ./.github/actions/go-setup
        with:
          cache: "false"
      - uses: ./.github/actions/go-build-cache
      - name: build cache hit rate
        run: .github/scripts/release-go-cache.sh stats linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
      - name: goreleaser (pinned)
        run: |
          # the official prebuilt GoReleaser, pinned by SHA256 (from its v2.19.0 checksums.txt)
          .github/scripts/fetch-tool.sh goreleaser v2.19.0 \
            https://github.com/goreleaser/goreleaser/releases/download/v2.19.0/goreleaser_Linux_x86_64.tar.gz \
            ebc3194ad1d1b1787614405285a0039665cd4c5bd3305215a1b201600f90630b goreleaser
      - name: build (goreleaser + hub-release)
        env:
          LONGARM_UPDATE_PUBKEY: ${{ vars.LONGARM_UPDATE_PUBKEY }}
          # the built-in hub; empty: none
          LONGARM_DEFAULT_HUB: ${{ vars.LONGARM_DEFAULT_HUB }}
          LONGARM_DEFAULT_HUB_CA: ${{ vars.LONGARM_DEFAULT_HUB_CA }}
        run: |
          goreleaser release --clean --skip=publish,docker
          go run -trimpath ./packaging/hubrelease --dist dist --out dist/hub-release
      - name: stage the artifact
        run: |
          v=$(jq -r .version dist/metadata.json)
          if [ "$v" != "$VERSION" ]; then
            echo "::error::goreleaser built $v, tag says $VERSION"
            exit 1
          fi
          mkdir -p upload/hub upload/extra upload/checksums
          cp dist/hub-release/* upload/hub/
          cp dist/longarm-hub_*.deb upload/extra/
          cp dist/checksums.txt upload/checksums/unix.txt
          find upload -type f -printf '%10s  %p\n' | sort -k2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unix
          path: upload
          if-no-files-found: error
          retention-days: 14 # lets a failed publish be re-run

  build-windows:
    name: build (Windows, MSIs)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      GORELEASER_CURRENT_TAG: ${{ needs.meta.outputs.tag }}
      CGO_ENABLED: "0" # as .goreleaser.yaml; also hubrelease (main's build cache)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser: changelog, previous tag
          persist-credentials: false
      - name: local tag (dry run, dev build)
        if: needs.meta.outputs.local_tag == 'true'
        run: git tag $env:TAG
      - uses: ./.github/actions/go-setup
        with:
          cache: "false"
      - uses: ./.github/actions/go-build-cache
      - name: build cache hit rate
        shell: bash
        run: .github/scripts/release-go-cache.sh stats windows/amd64 windows/arm64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: tools (goreleaser, WiX; pinned)
        run: |
          # the official prebuilt GoReleaser, pinned by SHA256 (from its v2.19.0 checksums.txt)
          $gr = Join-Path $env:LONGARM_TOOLS 'goreleaser'
          New-Item -ItemType Directory -Force $gr | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'goreleaser.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/goreleaser/goreleaser/releases/download/v2.19.0/goreleaser_Windows_x86_64.zip' -OutFile $zip
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($sha -ne '67807490e909a37f58ef40b67601896d8d4da2411c9839221dae55732c243fe9') { throw "goreleaser zip sha256 mismatch: $sha" }
          Expand-Archive -Force $zip $gr
          Remove-Item $zip
          "GORELEASER=$gr\goreleaser.exe" >> $env:GITHUB_ENV
          $wix = Join-Path $env:LONGARM_TOOLS 'wix'
          dotnet tool install wix --version 5.0.2 --tool-path $wix
          if ($LASTEXITCODE) { throw 'dotnet tool install wix failed' }
          $wix >> $env:GITHUB_PATH
          # Extensions go to .wix\ in the repo root (wix build runs there; gitignored).
          & "$wix\wix.exe" extension add WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2 WixToolset.Firewall.wixext/5.0.2
          if ($LASTEXITCODE) { throw 'wix extension add failed' }
      - name: build (goreleaser + MSIs + hub-release)
        env:
          LONGARM_UPDATE_PUBKEY: ${{ vars.LONGARM_UPDATE_PUBKEY }}
          # the built-in hub (binaries + the MSI's "Default"); empty: none
          LONGARM_DEFAULT_HUB: ${{ vars.LONGARM_DEFAULT_HUB }}
          LONGARM_DEFAULT_HUB_CA: ${{ vars.LONGARM_DEFAULT_HUB_CA }}
        run: ./packaging/build.ps1 -SkipPublish -Side windows
      - name: stage the artifact
        run: |
          $v = (Get-Content dist/metadata.json | ConvertFrom-Json).version
          if ($v -ne $env:VERSION) { throw "goreleaser built $v, tag says $env:VERSION" }
          New-Item -ItemType Directory upload/hub, upload/checksums | Out-Null
          Copy-Item dist/hub-release/* upload/hub/
          Copy-Item dist/checksums.txt upload/checksums/windows.txt
          Get-ChildItem upload -Recurse -File | Format-Table FullName, Length -AutoSize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: upload
          if-no-files-found: error
          retention-days: 14 # lets a failed publish be re-run

  # A dry run's stand-in for publish: the same merge and check, without
  # secrets; the merged artifact "release" is there to look at.
  gather:
    name: gather (checksums, file names)
    needs: [meta, build-unix, build-windows]
    if: needs.meta.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: one checksums.txt, check the file names
        run: .github/scripts/release-files.sh "$RUNNER_TEMP/release" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 3

  image:
    name: image (ghcr.io)
    # next to the builds (the image is built from the tag's source by its
    # Dockerfile); :X.Y.Z is pushed even if the build jobs fail, :latest only
    # after publish (image-latest). A dry run only runs the smoke test; a dev
    # build none (image.yml publishes :edge for every push to main).
    needs: meta
    if: needs.meta.outputs.dev == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      push: ${{ needs.meta.outputs.dry_run == 'false' }}

  image-latest:
    name: image :latest
    # for a release that was signed and published (and approved, with the
    # approval gate of docs/ci-cd.md 2.5)
    needs: [meta, publish, image]
    if: needs.meta.outputs.prerelease == 'false' && needs.meta.outputs.dry_run == 'false' && needs.meta.outputs.dev == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: ":latest -> :X.Y.Z (the same index: platforms, SBOM, provenance)"
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          img="ghcr.io/${OWNER,,}/longarm-hub"
          docker buildx imagetools create --tag "$img:latest" "$img:$VERSION"
          docker buildx imagetools inspect "$img:latest"

  publish:
    name: publish (sign, hub, GitHub Release)
    needs: [meta, build-unix, build-windows]
    if: needs.meta.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub Release
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache: "false"
      - uses: ./.github/actions/go-build-cache
      - name: build longarm from the tag
        env:
          CGO_ENABLED: "0" # as the release binaries (and main's build cache)
        run: go build -trimpath -o "$RUNNER_TEMP/longarm" ./cmd/longarm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: one checksums.txt, check the file names
        run: .github/scripts/release-files.sh "$RUNNER_TEMP/release" "$VERSION"
      - name: sign (LONGARM_RELEASE_KEY)
        env:
          LONGARM_RELEASE_KEY: ${{ secrets.LONGARM_RELEASE_KEY }}
          LONGARM_RELEASE_KEY_PASSWORD: ${{ secrets.LONGARM_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$LONGARM_RELEASE_KEY" ]; then
            echo "::warning::secret LONGARM_RELEASE_KEY is not set: the release is not signed (self-update needs signed releases)"
            exit 0
          fi
          .github/scripts/longarm-release.sh sign "$RUNNER_TEMP/longarm" "$RUNNER_TEMP/release/hub" "$VERSION"
      - name: upload to the hub (release-role certificate)
        if: vars.LONGARM_HUB != ''
        env:
          LONGARM_HUB: ${{ vars.LONGARM_HUB }}
          LONGARM_RELEASE_TLS: ${{ secrets.LONGARM_RELEASE_TLS }}
          LONGARM_RELEASE_KEY: ${{ secrets.LONGARM_RELEASE_KEY }}
          LONGARM_RELEASE_KEY_PASSWORD: ${{ secrets.LONGARM_RELEASE_KEY_PASSWORD }}
        run: .github/scripts/longarm-release.sh publish "$RUNNER_TEMP/longarm" "$RUNNER_TEMP/release/hub" "$VERSION" "$CHANNEL"
      - name: GitHub Release
        # dev builds: the hub only (one per push to main would bury the releases)
        if: needs.meta.outputs.dev == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          (cd hub && sha256sum -- *) >SHA256SUMS
          (cd extra && sha256sum -- *) >>SHA256SUMS
          flags=(--title "Longarm $VERSION" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber hub/* extra/* SHA256SUMS

  hub:
    name: hub (longarm-hub over SSH forced command)
    needs: [meta, publish]
    if: needs.meta.outputs.prerelease == 'false' && needs.meta.outputs.dry_run == 'false' && vars.LONGARM_HUB != '' && vars.HUB_SSH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: deploy longarm-hub
        env:
          HUB_SSH: ${{ vars.HUB_SSH }}
          HUB_DEPLOY_SSH_KEY: ${{ secrets.HUB_DEPLOY_SSH_KEY }}
          HUB_SSH_KNOWN_HOSTS: ${{ secrets.HUB_SSH_KNOWN_HOSTS }}
        # check = dry run (fetch + signature + version probe); deploy rolls
        # back by itself when /healthz doesn't report the version in 60 s.
        run: |
          .github/scripts/hub-deploy.sh check "$VERSION"
          .github/scripts/hub-deploy.sh deploy "$VERSION"

  rollout:
    name: rollout (canary, then the fleet)
    needs: [meta, publish, hub]
    # after the hub deploy (or without one when HUB_SSH isn't set)
    if: ${{ !cancelled() && needs.meta.outputs.prerelease == 'false' && needs.meta.outputs.dry_run == 'false' && vars.LONGARM_HUB != '' && needs.publish.result == 'success' && (needs.hub.result == 'success' || needs.hub.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache: "false"
      - uses: ./.github/actions/go-build-cache
      - name: build longarm from the tag
        env:
          CGO_ENABLED: "0" # as the release binaries (and main's build cache)
        run: go build -trimpath -o "$RUNNER_TEMP/longarm" ./cmd/longarm
      - name: longarm admin release push --canary 1 --wait 15m
        env:
          LONGARM_HUB: ${{ vars.LONGARM_HUB }}
          LONGARM_RELEASE_TLS: ${{ secrets.LONGARM_RELEASE_TLS }}
        run: .github/scripts/longarm-release.sh rollout "$RUNNER_TEMP/longarm" "$VERSION" 15m
