# The release of a version in the Microsoft-internal copy (gim-home/longarm)
# by hand: release.yml's publish job does it for every release and release
# candidate; this one is for a release from before that, or a failed run.
# It downloads this repository's GitHub Release of the tag and uploads the
# same files there (.github/scripts/gim-release.sh; docs/ci-cd.md "Internal
# mirror").
name: gim-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (e.g. v0.1.28); empty = the latest release
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: gim-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gim-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: this repository's release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
          ls -la "$RUNNER_TEMP/release"
          {
            echo "tag=$TAG"
            echo "sha=$sha"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
      - name: gim-home release (the same files)
        env:
          GIM_MIRROR_TOKEN: ${{ secrets.GIM_MIRROR_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          SHA: ${{ steps.rel.outputs.sha }}
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
        run: |
          cd "$RUNNER_TEMP/release"
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          "$GITHUB_WORKSPACE/.github/scripts/gim-release.sh" "$TAG" "${args[@]}" -- *
